# Home Library - self-hosted book catalogue.
#
# Deploy on the server:
#   1. mkdir -p home-library && cd home-library
#   2. save this file there as docker-compose.yml
#   3. docker compose up -d
#
# Update later with:   docker compose pull && docker compose up -d
#
# The image is public on GHCR, so there is no docker login and no GitHub account
# needed on the server. Nothing is built here: no Node, no compiler, no source.
name: home-library

services:
  home-library:
    image: ghcr.io/uff-login/home-library:latest
    container_name: home-library
    restart: unless-stopped

    ports:
      # Your reverse proxy talks to this. If the proxy runs on the same host you
      # can bind it to the loopback only: "127.0.0.1:8080:8080".
      - "8080:8080"

    environment:
      # The PIN is NOT written here - it lives in a file called `.env` next to
      # this one, which is never committed to git. Docker Compose reads it
      # automatically. Copy `.env.example` to `.env` and set BOOKSHELF_PIN.
      #
      # Leaving it unset makes the app generate a PIN and print it once:
      #   docker compose logs | grep -i pin
      # A PIN set in .env always wins over a stored one, so this is also the
      # recovery path if the PIN is forgotten: change it, `up -d` again.
      BOOKSHELF_PIN: "${BOOKSHELF_PIN:-}"
      # Optional (see .env.example): ratings/descriptions from Google Books.
      GOOGLE_BOOKS_KEY: "${GOOGLE_BOOKS_KEY:-}"

    volumes:
      # The database and cached covers. THIS is the library - back it up.
      - ./data:/data

    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Defence in depth: the container cannot gain privileges it was not given.
    security_opt:
      - no-new-privileges:true
